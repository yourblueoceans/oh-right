name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build

  # Deploys the app (Firebase Hosting) and the security rules to the real project "heyohright".
  # Runs only on main, and only after the FIREBASE_SERVICE_ACCOUNT secret is added (see README).
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT secret not set yet; skipping deploy."
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_KEY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_KEY == 'true'
        run: npm ci && npm run build
      - if: env.HAS_KEY == 'true'
        name: Deploy to Firebase (Spark plan: hosting + Firestore rules only)
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --project heyohright --only hosting,firestore:rules --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
